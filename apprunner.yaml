version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: ENVIRONMENT
      value: production
    - name: CYBERTHREAT_DATA_DIR
      value: /tmp/cyberthreat_data
